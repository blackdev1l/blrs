[workspace]
resolver = "2"
members = ["crates/blossom-core", "crates/blossom-store", "crates/blossom-http"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

# Sized for a Raspberry Pi: single codegen unit and thin LTO trade build time
# for a smaller, faster binary. `panic = "abort"` drops unwinding tables.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
