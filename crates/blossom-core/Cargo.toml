[package]
name = "blossom-core"
description = "Pure Blossom domain logic: hashes, MIME types, descriptors, byte ranges, BUD-11 authorization."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
hex = "0.4.3"
infer = "0.22.0"
mime_guess = "2.0.5"
secp256k1 = { version = "0.33.1", features = ["std", "rand"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.20"
