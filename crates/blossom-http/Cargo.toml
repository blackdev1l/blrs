[package]
name = "blossom-http"
description = "Blossom HTTP server: BUD-01/02/04/05/06/08/09/11/12 endpoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "blossom"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.4", features = ["macros"] }
blossom-core = { version = "0.1.0", path = "../blossom-core" }
blossom-store = { version = "0.1.0", path = "../blossom-store" }
bytes = "1.12.2"
clap = { version = "4.5.61", features = ["derive", "env"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "http2", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.20"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "time", "sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"

[dev-dependencies]
# Integration tests build real BUD-11 tokens: sign the kind-24242 event with a
# test key, then base64url-encode it. All three crates are already in the
# workspace lock via blossom-core, so this adds no new transitive versions.
base64 = "0.23.1"
hex = "0.4.3"
secp256k1 = { version = "0.33.1", features = ["std", "rand"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
